name: CI workflow for Laravel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: php-cli, unzip, curl, imagick, redis, mbstring, intl, openssl, php-bcmath, php-curl, php-json, php-mbstring, php-mysql, php-tokenizer, php-xml, php-zip

      - name: install composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');" &&
          php -r "if (hash_file('sha384', 'composer-setup.php') === 'c8b085408188070d5f52bcfe4ecfbee5f727afa458b2573b8eaaf77b3419b0bf2768dc67c86944da1544f06fa544fd47') { echo 'Installer verified'; } else { echo 'Installer corrupt'; unlink('composer-setup.php'); } echo PHP_EOL;" &&
          sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer &&
          rm composer-setup.php &&
          composer --version

      - name: install mysql
        run: |
          sudo apt update &&
          sudo apt install mysql-server &&
          sudo systemctl start mysql

      - name: Configure MySQL database
        run: |
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS laravel_fullstack_app;"
          sudo mysql -e "CREATE USER IF NOT EXISTS 'laravel_fullstack_admin'@'localhost' IDENTIFIED BY '12345678';"
          sudo mysql -e "ALTER USER 'laravel_fullstack_admin'@'localhost' IDENTIFIED BY '12345678';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON laravel_fullstack_app.* TO 'laravel_fullstack_admin'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"


      - name: create .env file
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel_fullstack_app/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=laravel_fullstack_admin/' .env
          sed -i '/^DB_PASSWORD=/d' .env
          echo "DB_PASSWORD=12345678" >> .env
        env:
          DB_PASSWORD: "12345678"

      - name: install composer
        run: |
          composer update &&
          composer install

      - name: generate app key
        run: php artisan key:generate

      - name: clear cache
        run: php artisan config:cache && php artisan cache:clear && php artisan optimize:clear

      - name: run migration
        run: php artisan migrate --force




