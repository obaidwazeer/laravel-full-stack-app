name: CI workflow for Laravel

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: laravel_fullstack_test
      DB_USERNAME: laravel_ci
      DB_PASSWORD: ci_test_password
      CACHE_DRIVER: file
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql, xml, curl, zip, intl
          coverage: none

      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          sudo systemctl is-active mysql.service

      - name: Create CI database
        run: |
          mysql --host=127.0.0.1 --user=root --password=root <<'SQL'
          CREATE DATABASE laravel_fullstack_test
            CHARACTER SET utf8mb4
            COLLATE utf8mb4_unicode_ci;

          CREATE USER 'laravel_ci'@'127.0.0.1'
            IDENTIFIED BY 'ci_test_password';

          GRANT ALL PRIVILEGES ON laravel_fullstack_test.*
            TO 'laravel_ci'@'127.0.0.1';

          FLUSH PRIVILEGES;
          SQL

      - name: Prepare test environment
        run: |
          cp .env.example .env

          sed -i -E '/^(APP_ENV|APP_DEBUG|DB_CONNECTION|DB_HOST|DB_PORT|DB_DATABASE|DB_USERNAME|DB_PASSWORD|CACHE_DRIVER|CACHE_STORE|SESSION_DRIVER|QUEUE_CONNECTION)=/d' .env

          cat >> .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=true
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=laravel_fullstack_test
          DB_USERNAME=laravel_ci
          DB_PASSWORD=ci_test_password
          CACHE_DRIVER=file
          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          EOF

      - name: Install Composer dependencies
        run: composer update --with-all-dependencies && composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Clear configuration cache
        run: php artisan config:clear

      - name: Run database migrations
        run: php artisan migrate:fresh --force

      - name: fix deprecated schema
        run: vendor/bin/phpunit --migrate-configuration

      - name: Run Laravel tests
        run: php artisan test

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

      - name: Create deployment archive
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./tests' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./.phpunit.result.cache' \
            -czf "$RUNNER_TEMP/release.tar.gz" \
            -C "$GITHUB_WORKSPACE" .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 3
          if-no-files-found: error
