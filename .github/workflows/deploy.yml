name: Deploy Full Stack Laravel App with Terraform

on:
  push:
    branches:
      - master

env:
  AWS_REGION: eu-north-1

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Commit SHA
        id: commit
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Initialize Terraform
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Validate Terraform
        working-directory: ./terraform
        run: terraform validate

      - name: Plan Terraform
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="ssh_public_key=${{ secrets.KEY_PAIR_PUB }}" \
            -out=PLAN

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform/PLAN
          retention-days: 1
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    # Only apply a plan from the master branch.
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master'
      }}

    environment:
      name: terraform apply

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Commit
        env:
          PLANNED_COMMIT: ${{ needs.terraform-plan.outputs.commit_sha }}
        run: |
          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo "Planned commit: $PLANNED_COMMIT"
          echo "Apply commit:   $CURRENT_COMMIT"

          if [ "$PLANNED_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "ERROR: Plan and apply commits do not match."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Initialize Terraform
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform

      - name: Apply Terraform Plan
        working-directory: ./terraform
        run: terraform apply -input=false PLAN
