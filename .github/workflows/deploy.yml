on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-24.04

    environment:
      name: production

    permissions:
      actions: read
      contents: read

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: "ubuntu"
      APP_DIR: /var/www/laravel
      AWS_REGION: eu-north-1
      MIGRATION_SECRET_ID: prod/laravel/migration-db
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_HEALTH_URL: ${{ vars.APP_HEALTH_URL }}

    steps:
      - name: Download terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: output-ips
          path: ./output_data

      - name: Load ips into GitHub environment variables
        run: cat ./output_data/ips.txt >> $GITHUB_ENV

      - name: Download artifact from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: laravel-release
          path: ./release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

