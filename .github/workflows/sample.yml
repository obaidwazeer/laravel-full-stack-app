name: sample 

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Available Environment Variables
        run: env | sort

      - name: check php version
        run: php -v

      - name: mysql version
        run: mysql --version

      - name: composer version
        run: composer -v

      - name: mysql status
        run: sudo systemctl status mysql
