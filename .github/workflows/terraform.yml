name: Deploy Infra

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  AWS_REGION: "eu-north-1"

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout Repository
        uses: actions/checkout@v4

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: initialize Terraform
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: ./terraform

      - name: plan terraform
        id: plan
        run: |
          terraform plan \
            -var="ssh_public_key=${{ secrets.KEY_PAIR_PUB }}" \
            -out=PLAN
        working-directory: ./terraform

      - name: upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform/PLAN
          retention-days: 1
          if-no-files-found: error

  terraform-apply:
    needs: terraform-plan
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: checkout Repository
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: configure AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: initialize Terraform
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
        working-directory: ./terraform

      - name: download terrarom plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform

      - name: apply terraform plan
        run: terraform apply PLAN
        working-directory: ./terraform

      - name: terraform output
        id: ips
        working-directory: ./terraform
        run: |
          mkdir -p output_data
          echo WEB_PUBLIC_IP="$(terraform output -raw web_public_ip )" >> output_data/ips.txt
          echo WEB_PRIVATE_IP="$(terraform output -raw web_private_ip)" >> output_data/ips.txt
          echo DATABASE_PRIVATE_IP="$(terraform output -raw database_private_ip)" >> output_data/ips.txt
          echo NET_GATEWAY_ID="$(terraform output -raw nat_gateway_id)" >> output_data/ips.txt

      - name: ips artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-ips
          path: ./terraform/output_data/ips.txt
          retention-days: 1
          if-no-files-found: error

      - name: View All Terraform Outputs
        run: terraform output
        working-directory: ./terraform

